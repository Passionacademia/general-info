let currentSection = null, currentTopic = null;
let flatList = [];

function buildTOC(){
  const container = document.getElementById('tocContainer');
  container.innerHTML = '';
  flatList = [];
  let n = 1;
  Object.keys(DATA).forEach(secKey => {
    const sec = DATA[secKey];
    const secDiv = document.createElement('div');
    secDiv.className = 'toc-section';
    secDiv.dataset.sec = secKey;
    const title = document.createElement('div');
    title.className = 'toc-section-title';
    title.innerHTML = '<span class="n">' + String(n).padStart(2,'0') + '</span><span>' + sec.title + '</span>';
    secDiv.appendChild(title);
    n++;
    Object.keys(sec.topics).forEach(topKey => {
      const top = sec.topics[topKey];
      flatList.push({sec: secKey, top: topKey});
      const btn = document.createElement('button');
      btn.className = 'toc-item';
      btn.dataset.sec = secKey;
      btn.dataset.top = topKey;
      btn.dataset.search = (top.title + ' ' + top.kicker).toLowerCase();
      btn.innerHTML = top.title + (top.flag ? '<span class="flag">' + top.flag + '</span>' : '');
      btn.onclick = () => showTopic(secKey, topKey);
      secDiv.appendChild(btn);
    });
    container.appendChild(secDiv);
  });
}

function showTopic(secKey, topKey){
  currentSection = secKey; currentTopic = topKey;
  const top = DATA[secKey].topics[topKey];
  document.querySelectorAll('.toc-item').forEach(b => {
    b.classList.toggle('active', b.dataset.sec===secKey && b.dataset.top===topKey);
  });
  const idx = flatList.findIndex(f => f.sec===secKey && f.top===topKey);
  const reader = document.getElementById('reader');
  reader.innerHTML = `
    <div class="article-kicker">${top.kicker}</div>
    <h1 class="article-title">${top.title}</h1>
    <p class="article-dek">${top.dek}</p>
    <div class="status-row">${top.status.map(s => '<span class="status-pill">'+s+'</span>').join('')}</div>
    <div class="article-body">${top.body}</div>
    <div class="sources"><span class="lbl">Sources consulted</span>${top.sources}</div>
    <div class="nav-buttons">
      <button id="prevBtn">&larr; Previous</button>
      <button id="nextBtn">Next &rarr;</button>
    </div>
  `;
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= flatList.length - 1;
  document.getElementById('prevBtn').onclick = () => { if(idx>0) showTopic(flatList[idx-1].sec, flatList[idx-1].top); window.scrollTo(0,0); };
  document.getElementById('nextBtn').onclick = () => { if(idx<flatList.length-1) showTopic(flatList[idx+1].sec, flatList[idx+1].top); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

function filterTOC(q){
  q = q.toLowerCase().trim();
  document.querySelectorAll('.toc-item').forEach(b => {
    b.style.display = (!q || b.dataset.search.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.toc-section').forEach(s => {
    const visible = Array.from(s.querySelectorAll('.toc-item')).some(b => b.style.display !== 'none');
    s.style.display = visible ? '' : 'none';
  });
}

buildTOC();
showTopic('conflicts', 'ukraine');
</script>
